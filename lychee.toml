# 外部連結與靜態資源檢查設定（沿用 BAT 站的 lychee.toml）。外部連結失敗只警告，不擋。
#
# dist 的站內連結是 <PORTAL_BASE><頁面>（base + cleanUrls，沒有 .html）。PORTAL_BASE 預設是 /；
# 託管定案（P2）後若改成 /<repo 名>/，就把 build 產物（site/.vitepress/dist）解到 _lychee/<repo 名>/，再以
# --root-dir <絕對路徑>/_lychee 執行；root_dir 必須是絕對路徑，所以放在指令列，不寫在這裡。

# cleanUrls：/cases → cases.html；/guide/ → guide/index.html
fallback_extensions = ["html"]
index_files = ["index.html"]

# GitHub 連結偶爾回 429（速率限制）；429 仍不算死連結
accept = ["200..=299", "429"]
max_retries = 3
retry_wait_time = 2
timeout = 20
max_concurrency = 16

exclude_loopback = true
